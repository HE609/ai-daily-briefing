<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Daily Briefing</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --surface2: #1a1a24;
      --border: #2a2a3a;
      --accent: #6c63ff;
      --accent2: #00d4ff;
      --text: #e8e8f0;
      --text2: #9898b0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      line-height: 1.7;
    }
    a { color: var(--accent2); text-decoration: none; }
    a:hover { text-decoration: underline; }

    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(10,10,15,0.9);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .header-inner {
      max-width: 1100px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 32px; height: 60px;
    }
    .logo {
      font-size: 18px; font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .logo span { color: var(--text2); font-weight: 400; font-size: 13px; margin-left: 8px; }
    .badge {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 20px; padding: 4px 14px; font-size: 12px; color: var(--text2);
    }

    .hero {
      max-width: 1100px; margin: 0 auto; padding: 80px 32px 60px;
      text-align: center;
    }
    .hero h1 {
      font-size: 52px; font-weight: 800; letter-spacing: -2px;
      background: linear-gradient(135deg, #fff 0%, var(--accent2) 50%, var(--accent) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      line-height: 1.1; margin-bottom: 16px;
    }
    .hero p {
      font-size: 18px; color: var(--text2); max-width: 560px; margin: 0 auto 36px;
    }
    .tags { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .tag {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: 6px 16px; font-size: 13px; color: var(--text2);
    }

    .container { max-width: 1100px; margin: 0 auto; padding: 0 32px 80px; }
    .section-title {
      font-size: 12px; text-transform: uppercase; letter-spacing: 2px;
      color: #555; margin-bottom: 24px;
      display: flex; align-items: center; gap: 16px;
    }
    .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px; padding: 24px;
      transition: all 0.25s; cursor: pointer;
      position: relative; overflow: hidden;
    }
    .card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      opacity: 0; transition: opacity 0.25s;
    }
    .card:hover {
      border-color: var(--accent); transform: translateY(-3px);
      box-shadow: 0 16px 48px rgba(108,99,255,0.1);
    }
    .card:hover::before { opacity: 1; }

    .card.featured { grid-column: 1 / -1; }
    .card-date {
      font-size: 12px; color: #555; margin-bottom: 10px;
      display: flex; align-items: center; gap: 8px;
    }
    .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent2);
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.2; } }
    .card h2 { font-size: 18px; font-weight: 700; margin-bottom: 10px; line-height: 1.3; }
    .card h2 a { color: var(--text); }
    .card h2 a:hover { color: var(--accent2); text-decoration: none; }
    .card-summary {
      font-size: 13px; color: var(--text2); line-height: 1.6;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
      margin-bottom: 16px;
    }
    .sources { display: flex; flex-wrap: wrap; gap: 6px; }
    .source-tag {
      font-size: 11px; color: var(--accent2);
      background: rgba(0,212,255,0.07);
      border: 1px solid rgba(0,212,255,0.2);
      border-radius: 4px; padding: 2px 8px;
    }
    .read-more {
      font-size: 12px; color: #555; margin-top: 14px;
      display: flex; align-items: center; gap: 4px;
      transition: color 0.2s;
    }
    .card:hover .read-more { color: var(--accent2); }

    footer {
      border-top: 1px solid var(--border);
      padding: 40px; text-align: center;
      color: #444; font-size: 13px;
    }
    footer a { color: #444; }
    footer a:hover { color: var(--accent2); }

    @media (max-width: 768px) {
      .hero h1 { font-size: 34px; }
      .grid { grid-template-columns: 1fr; }
      .hero { padding: 50px 20px 40px; }
      .container { padding: 0 20px 60px; }
      .header-inner { padding: 0 20px; }
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">AI Daily Briefing <span>/ 全球AI前沿情报</span></div>
    <div class="badge">🕒 每日 08:00 自动更新</div>
  </div>
</header>

<section class="hero">
  <h1>AI Daily Briefing</h1>
  <p>追踪全球顶级研究团队最新发布 · arXiv · 公众号 · 知乎 · X · 小红书 · 全平台覆盖</p>
  <div class="tags">
    <span class="tag">🌐 World Models / VLA</span>
    <span class="tag">🖼️ 多模态 / VLM</span>
    <span class="tag">🤖 Agent / 机器人</span>
    <span class="tag">🧪 AI for Science</span>
    <span class="tag">⚡ 新架构 / 范式</span>
  </div>
</section>

<main class="container">
  <div class="section-title">📅 最新日报</div>
  <div class="grid" id="briefings">
    <div class="card featured" style="text-align:center;padding:60px;color:#444;">
      正在加载日报数据...
    </div>
  </div>
</main>

<footer>
  <p>AI Daily Briefing · 全平台追踪 · Powered by <a href="https://github.com/HE609/ai-daily-briefing">OpenClaw</a></p>
</footer>

<script>
(function() {
  const REPO = 'HE609/ai-daily-briefing';
  const BRANCH = 'main';

  function getBadge(dateStr) {
    const d = new Date(dateStr.replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3'));
    const now = new Date();
    const diff = Math.floor((now - d) / 86400000);
    if (diff === 0) return '<span class="dot"></span> 今日';
    if (diff === 1) return '昨天';
    if (diff <= 7) return diff + '天前';
    return dateStr;
  }

  function cleanText(md) {
    md = md.replace(/^---[\s\S]*?---\n/, '');
    md = md.replace(/^#{1,6}\s+/gm, '');
    md = md.replace(/\*\*([^*]+)\*\*/g, '$1');
    md = md.replace(/\[([^\]]+)\]\([^)]+\)/g, '$1');
    md = md.replace(/```[\s\S]*?```/g, '');
    md = md.replace(/^>\s*/gm, '');
    md = md.replace(/^[-*]\s+/gm, '');
    md = md.trim();
    return md.substring(0, 220);
  }

  function render(files) {
    const grid = document.getElementById('briefings');
    if (!files.length) {
      grid.innerHTML = '<p style="color:#444;text-align:center;grid-column:1/-1;padding:60px;">暂无日报数据</p>';
      return;
    }
    grid.innerHTML = '';
    files.forEach((f, i) => {
      const date = f.name.match(/^(\d{4}-\d{2}-\d{2})/)?.[1] || f.name;
      const isFeatured = i === 0;
      grid.innerHTML +=
        '<div class="card' + (isFeatured ? ' featured' : '') + '">' +
          '<div class="card-date">' + (isFeatured ? '<span class="dot"></span>' : '') + getBadge(date) + ' · ' + date + '</div>' +
          '<h2><a href="https://github.com/' + REPO + '/blob/main/' + encodeURIComponent(f.name) + '" target="_blank">' + (isFeatured ? '🚨 ' : '') + 'AI Daily Briefing · ' + date + '</a></h2>' +
          '<div class="card-summary" id="sum-' + i + '">加载中...</div>' +
          '<div><a href="https://github.com/' + REPO + '/blob/main/' + encodeURIComponent(f.name) + '" target="_blank" class="read-more">阅读全文 →</a></div>' +
        '</div>';
      fetch(f.download_url).then(r => r.text()).then(txt => {
        document.getElementById('sum-' + i).textContent = cleanText(txt);
      }).catch(() => {
        document.getElementById('sum-' + i).textContent = '点击阅读全文';
      });
    });
  }

  fetch('https://api.github.com/repos/' + REPO + '/contents?ref=' + BRANCH)
    .then(r => r.json())
    .then(files => {
      const mdFiles = files
        .filter(f => f.name.endsWith('.md') && /^\d{4}-\d{2}-\d{2}/.test(f.name))
        .sort((a, b) => b.name.localeCompare(a.name));
      render(mdFiles);
    })
    .catch(() => {
      document.getElementById('briefings').innerHTML =
        '<p style="color:#444;text-align:center;grid-column:1/-1;padding:60px;">加载失败，请刷新</p>';
    });
})();
</script>

</body>
</html>
